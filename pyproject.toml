[project]
name = "agent-roi-framework"
version = "0.1.0"
description = "Agent ROI framework: cost and value model, payback, break-even containment, sensitivity and intake scoring"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
